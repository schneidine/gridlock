<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentinel Utilities — DESC × Georgia Power × Duke Energy Coordination</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<style>
  :root {
    --desc-color: #3b82f6;
    --gpc-color: #f97316;
    --duke-color: #a78bfa;
    --ring: #facc15;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --bg: #0b1020;
    --panel: #12172b;
    --panel-2: #171d36;
    --text: #e6e9f2;
    --muted: #8b93ad;
    --border: #262c47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 440px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--panel); gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .ring { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px dashed var(--ring); }
  #map { height: 100%; width: 100%; }
  #sidebar { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; }
  #sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 16px 6px; margin: 0; }
  .stat-row { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .stat { flex: 1; text-align: center; }
  .stat .n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .filters { display: flex; gap: 6px; padding: 0 16px 8px; flex-wrap: wrap; }
  .filters button { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-size: 11.5px; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .filters button.active { border-color: var(--ring); }
  .overlap-list { padding: 0 10px 12px; }
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 6px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #3b4374; }
  .card.selected { border-color: var(--ring); }
  .card .rank-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
  .card .rank { font-size: 12px; color: var(--muted); font-weight: 700; }
  .card .score { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: #232a48; overflow: hidden; margin: 2px 0 6px; display: flex; }
  .bar i { display: block; height: 100%; }
  .card .proj { font-size: 12.5px; line-height: 1.4; margin: 2px 0; }
  .tag-a { color: var(--desc-color); font-weight: 700; }
  .tag-b { color: var(--gpc-color); font-weight: 700; }
  .tag-c { color: var(--duke-color); font-weight: 700; }
  .card .meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .conf-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #1c2440; white-space: nowrap; }
  .conf-tag.confirmed { color: var(--ok); }
  .conf-tag.low_confidence { color: var(--warn); }
  .conf-tag.unlocated, .conf-tag.rejected { color: var(--bad); }
  .conf-tag.not_a_place { color: var(--muted); }

  .panel { margin: 12px 14px; border: 1px solid var(--border); background: var(--panel-2); border-radius: 12px; padding: 12px 14px; font-size: 12px; line-height: 1.5; }
  .panel .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: 6px; color: var(--muted); }
  .panel .headline { font-size: 20px; font-weight: 750; margin-bottom: 2px; }
  .panel .muted { color: var(--muted); }
  .panel details summary { cursor: pointer; color: var(--muted); margin-top: 6px; }
  #cost-impact { border-color: #3a4a2e; background: linear-gradient(180deg, #1a2416, #141c11); }
  #cost-impact .label { color: #84cc16; }
  #detail { border-color: #4a4420; display: none; }
  #detail .label { color: var(--ring); }
  .ep { margin: 4px 0 4px 8px; padding-left: 8px; border-left: 2px solid var(--border); }
  .ep .src { color: var(--muted); font-size: 11px; word-break: break-word; }
  .ep .note { color: var(--muted); font-size: 11px; }
  table.kv { width: 100%; border-collapse: collapse; margin: 6px 0; font-variant-numeric: tabular-nums; }
  table.kv td { padding: 2px 0; }
  table.kv td:last-child { text-align: right; }
  .unmapped li { margin: 3px 0; }
  .leaflet-popup-content { font-size: 12px; max-width: 300px; line-height: 1.45; }
  .leaflet-popup-content b.t { display: block; margin-bottom: 4px; font-size: 12.5px; }

  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; height: auto; }
    #sidebar { border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Sentinel Utilities</h1>
      <div class="sub">Planned transmission work across neighboring utilities, within 25 miles</div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--desc-color)"></i>DESC (SC)</span>
      <span><i class="dot" style="background:var(--gpc-color)"></i>Georgia Power (GA)</span>
      <span><i class="dot" style="background:var(--duke-color)"></i>Duke Energy (NC/SC)</span>
      <span><i class="dot" style="background:transparent;border:1.5px dashed var(--muted)"></i>low confidence</span>
      <span><i class="ring"></i>25-mi overlap ring</span>
    </div>
  </header>
  <div id="map"></div>
  <div id="sidebar">
    <div class="stat-row" id="stats"></div>
    <div class="panel" id="detail"></div>
    <div class="panel" id="cost-impact"></div>
    <h2>Coordination opportunities, ranked</h2>
    <div class="filters" id="filters"></div>
    <div class="overlap-list" id="overlap-list"></div>
    <div class="panel" id="method"></div>
    <div class="panel" id="unmapped"></div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
const MI = 1609.344;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const confTag = c => `<span class="conf-tag ${c}">${(c || "unknown").replace(/_/g, " ")}</span>`;
const fmtUsd = n => n == null ? "n/a" : "$" + Math.round(n).toLocaleString("en-US");
const fmtDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) : "date n/a";

let DATA, BY_ID = {}, map, baseLayer, ringLayer, focusLayer;
let filter = "all", selected = null;
const markers = {};

// short tag + CSS class per utility name, as written by backend/pipeline/build_dataset.py
const UTIL = {
  "Dominion Energy South Carolina": { short: "DESC", cls: "tag-a", color: "--desc-color" },
  "Georgia Power": { short: "GPC", cls: "tag-b", color: "--gpc-color" },
  "Duke Energy": { short: "DUKE", cls: "tag-c", color: "--duke-color" },
};
function isDesc(p) { return p.utility.startsWith("Dominion"); }
function color(p) { return css(UTIL[p.utility].color); }
function tag(utility) { const u = UTIL[utility]; return `<span class="${u.cls}">${u.short}</span>`; }
function allProjects(d = DATA) { return [...d.desc_projects, ...d.gpc_projects, ...(d.duke_projects || [])]; }

function initMap() {
  map = L.map("map").setView([32.9, -81.6], 8);
  // CARTO basemaps now return "API key required" tiles; Esri's dark canvas is keyless
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors", maxZoom: 16
  }).addTo(map);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 16, pane: "overlayPane", opacity: 0.8
  }).addTo(map);
  ringLayer = L.layerGroup().addTo(map);
  baseLayer = L.layerGroup().addTo(map);
  focusLayer = L.layerGroup().addTo(map);
}

function endpointHtml(e) {
  const c = e.checks || {};
  const bits = [];
  if (c.name_score != null) bits.push(`name match ${c.name_score}`);
  if (c.operator_ok != null) bits.push(`operator ${c.operator_ok ? "✓" : "✗"}`);
  if (c.zone_km != null) bits.push(`${c.zone_km} km from zone centroid`);
  if (c.osm_agrees_km != null) bits.push(`OSM agrees within ${c.osm_agrees_km} km`);
  return `<div class="ep"><b>${esc(e.name)}</b> ${confTag(e.confidence)}
    <div class="src">${esc(e.source || e.rejected_source || "")}</div>
    ${bits.length ? `<div class="note">${bits.join(" · ")}</div>` : ""}
    ${(e.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join("")}</div>`;
}

function projectHtml(p) {
  const utag = tag(p.utility);
  const extra = isDesc(p)
    ? `${esc(p.source_project_id)} · ${esc(p.status)} · ${fmtUsd(p.total_cost_usd)}`
    : p.balancing_authority
      ? `${esc(p.balancing_authority)} · SERTP 2025 preliminary plan p.${p.source_page} · no cost published`
      : `TEAMS ${esc(p.teams_number)} · zone ${esc(p.zone)} · ${esc(p.sponsor)} · cost redacted (CEII)`;
  const flags = (p.data_quality_flags || []).map(f => `<div class="note" style="color:var(--warn)">⚠ ${esc(f)}</div>`).join("");
  return `<b class="t">${utag} ${esc(p.title)}</b>
    <div class="muted">${extra}</div>
    <div>In service: ${p.in_service_date ? fmtDate(p.in_service_date) : (p.in_service_year ?? "date n/a")} ${confTag(p.geo ? p.geo.confidence : "unlocated")}</div>
    ${p.description ? `<div class="muted" style="margin-top:4px">${esc(p.description)}</div>` : ""}
    ${flags}
    <div style="margin-top:4px">${p.endpoints.map(endpointHtml).join("")}</div>`;
}

function renderProjects() {
  const inOverlap = new Set(DATA.overlaps.flatMap(o => [o.project_id_a, o.project_id_b]));
  allProjects().forEach(p => {
    if (!p.geo) return;
    const c = color(p), low = p.geo.confidence !== "confirmed", hot = inOverlap.has(p.project_id);
    if (p.geo.points.length > 1) {
      L.polyline(p.geo.points, { color: c, weight: hot ? 3 : 2, opacity: hot ? 0.9 : 0.45, dashArray: low ? "4,4" : null })
        .bindPopup(projectHtml(p), { maxWidth: 320 }).addTo(baseLayer);
    }
    const m = L.circleMarker(p.geo.center, {
      radius: hot ? 7 : 4.5, color: c, weight: low ? 1.5 : 2, fillColor: c,
      fillOpacity: low ? 0.15 : (hot ? 0.95 : 0.55), dashArray: low ? "2,3" : null
    }).bindPopup(projectHtml(p), { maxWidth: 320 }).addTo(baseLayer);
    markers[p.project_id] = m;
  });
  // one faint 25-mile ring around every DESC project that has at least one GPC project inside it
  DATA.desc_projects.filter(p => p.geo && inOverlap.has(p.project_id)).forEach(p => {
    L.circle(p.geo.center, { radius: 25 * MI, color: css("--ring"), weight: 1, opacity: 0.35, dashArray: "6,6", fill: true, fillOpacity: 0.03, interactive: false }).addTo(ringLayer);
  });
}

function renderStats() {
  const all = allProjects();
  const mapped = all.filter(p => p.geo).length;
  const s = DATA.summary;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${mapped}/${all.length}</div><div class="l">Projects mapped</div></div>
    <div class="stat"><div class="n">${DATA.overlaps.length}</div><div class="l">Pairs &lt; 25 mi</div></div>
    <div class="stat"><div class="n">${s.overlaps_confirmed}</div><div class="l">Confirmed pairs</div></div>
    <div class="stat"><div class="n">${s.organizer_reproduced}</div><div class="l">Organizer check</div></div>`;
}

function renderFilters() {
  const opts = { all: "All", confirmed: "Confirmed only", low_confidence: "Low confidence", soon: "Within 1 yr" };
  const el = document.getElementById("filters");
  el.innerHTML = "";
  Object.entries(opts).forEach(([k, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = k === filter ? "active" : "";
    b.onclick = () => { filter = k; renderFilters(); renderList(); };
    el.appendChild(b);
  });
}

function rows() {
  return DATA.overlaps.filter(o =>
    filter === "all" || (filter === "soon" ? o.day_gap != null && o.day_gap <= 365 : o.confidence === filter));
}

function scoreParts(o) {
  const w = DATA.summary.scoring;
  const d = w.w_distance * (1 - o.distance_mi / DATA.summary.threshold_mi);
  const t = w.w_time * (1 - Math.min(o.day_gap ?? w.max_gap_days, w.max_gap_days) / w.max_gap_days);
  return { d, t };
}

function renderList() {
  const el = document.getElementById("overlap-list");
  el.innerHTML = "";
  const list = rows();
  if (!list.length) { el.innerHTML = `<div class="panel muted">No pairs match this filter.</div>`; return; }
  list.forEach(o => {
    const { d, t } = scoreParts(o);
    const card = document.createElement("div");
    card.className = "card" + (selected === o.overlap_id ? " selected" : "");
    card.innerHTML = `
      <div class="rank-row"><span class="rank">#${o.rank}</span><span class="score">${o.score.toFixed(3)}</span></div>
      <div class="bar" title="distance ${d.toFixed(2)} + timing ${t.toFixed(2)}"><i style="width:${d * 100}%;background:var(--ring)"></i><i style="width:${t * 100}%;background:#a78bfa"></i></div>
      <div class="proj">${tag(o.utility_a)} ${esc(o.project_a_title)}</div>
      <div class="proj">${tag(o.utility_b)} ${esc(o.project_b_title)}</div>
      <div class="meta"><span>${o.distance_mi} mi · ${o.day_gap != null ? o.day_gap + " days apart" : "date n/a"}</span>${confTag(o.confidence)}</div>`;
    card.onclick = () => focusOverlap(o);
    el.appendChild(card);
  });
}

function focusOverlap(o) {
  selected = o.overlap_id;
  history.replaceState(null, "", "#" + o.overlap_id);
  renderList();
  focusLayer.clearLayers();
  const a = BY_ID[o.project_id_a], b = BY_ID[o.project_id_b];
  const ring = L.circle(a.geo.center, { radius: 25 * MI, color: css("--ring"), weight: 2, fillOpacity: 0.06, interactive: false }).addTo(focusLayer);
  L.polyline([a.geo.center, b.geo.center], { color: "#fff", weight: 2, dashArray: "5,6", opacity: 0.9 })
    .bindTooltip(`${o.distance_mi} mi`, { permanent: true, direction: "center", className: "" }).addTo(focusLayer);
  [a, b].forEach(p => L.circleMarker(p.geo.center, { radius: 11, color: css("--ring"), weight: 2, fill: false, interactive: false }).addTo(focusLayer));
  map.fitBounds(ring.getBounds(), { padding: [10, 10] });

  const { d, t } = scoreParts(o);
  const el = document.getElementById("detail");
  el.style.display = "block";
  el.innerHTML = `<div class="label">Selected pair · #${o.rank} of ${DATA.overlaps.length}</div>
    <table class="kv">
      <tr><td>Center-to-center distance</td><td><b>${o.distance_mi} mi</b> (${o.distance_km} km)</td></tr>
      <tr><td>In-service gap</td><td><b>${o.day_gap ?? "n/a"} days</b>${o.day_gap != null ? ` (${(o.day_gap / 365.25).toFixed(1)} yr)` : ""}</td></tr>
      <tr><td>Score = distance + timing</td><td><b>${o.score.toFixed(3)}</b> = ${d.toFixed(3)} + ${t.toFixed(3)}</td></tr>
      <tr><td>Location confidence</td><td>${confTag(o.confidence)}</td></tr>
    </table>
    <details open><summary>${esc(a.utility)} project</summary>${projectHtml(a)}</details>
    <details><summary>${esc(b.utility)} project</summary>${projectHtml(b)}</details>`;
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderCostImpact(ci) {
  const el = document.getElementById("cost-impact");
  if (!ci) { el.style.display = "none"; return; }
  const o = ci.overlap, kc = ci.known_costs, sv = ci.illustrative_savings_estimate;
  el.innerHTML = `<div class="label">Bonus · cost &amp; impact, top pair</div>
    <div class="headline">${fmtUsd(sv.savings_usd_low)} – ${fmtUsd(sv.savings_usd_high)}</div>
    <div class="muted">${esc(sv.framing)} · ${sv.savings_pct_range.map(x => x * 100 + "%").join("–")} of DESC's public job cost</div>
    <table class="kv">
      <tr><td><span class="tag-a">DESC</span> ${esc(o.desc_project)}</td><td>${fmtUsd(kc.desc_total_project_cost_usd)}</td></tr>
      ${kc.desc_cost_per_mile_usd ? `<tr><td class="muted">${kc.desc_line_miles} mi of line</td><td class="muted">${fmtUsd(kc.desc_cost_per_mile_usd)}/mi</td></tr>` : ""}
      <tr><td><span class="tag-b">GPC</span> ${esc(o.gpc_project)}</td><td class="muted">redacted (CEII)</td></tr>
    </table>
    <details><summary>Why, assumptions &amp; sources</summary>
      <div>${esc(ci.narrative)}</div>
      <div class="muted" style="margin-top:6px">${esc(sv.assumption)}.<br/>${esc(kc.gpc_cost_note)}<br/>${esc(sv.benchmark_source)}</div>
    </details>`;
  el.style.cursor = "pointer";
  el.onclick = e => {
    if (e.target.closest("details")) return;
    const ov = DATA.overlaps.find(x => x.project_id_a === o.desc_project_id && x.project_id_b === o.gpc_project_id);
    if (ov) focusOverlap(ov);
  };
}

function renderMethod() {
  const s = DATA.summary, w = s.scoring;
  const ep = k => Object.entries(s[k].endpoints).map(([c, n]) => `${n} ${c.replace(/_/g, " ")}`).join(", ");
  document.getElementById("method").innerHTML = `<div class="label">How pairs are found &amp; ranked</div>
    <div><b>Distance</b>: haversine between project centers (midpoint of located endpoints). Every pair under ${s.threshold_mi} mi is an overlap.</div>
    <div style="margin-top:4px"><b>Score</b> = ${w.w_distance}·(1 − dist/${s.threshold_mi}) + ${w.w_time}·(1 − min(gap, ${w.max_gap_days})/${w.max_gap_days}).
      Distance dominates because shared right-of-way, staging and crews only exist when the work is physically close; timing gets ${w.w_time * 100}% because a schedule can be moved, geography can't. Gaps over 5 years earn no timing credit.</div>
    <details><summary>Validation</summary>
      <div class="muted">Endpoints are fuzzy-matched (rapidfuzz) to ${"OSM"} substations from one Overpass pull, filtered by operator and state, then checked against the GPC planning zone (same name, wrong county gets rejected) and the organizer's worked example.<br/>
      DESC endpoints: ${ep("desc")}.<br/>GPC endpoints: ${ep("gpc")}.<br/>${s.duke ? `Duke endpoints: ${ep("duke")}.<br/>` : ""}
      ${s.gpc_rows_dropped_other_sponsors} non-Georgia-Power rows (GTC, MEAG, DU) excluded; SAV (Georgia Power Savannah) kept.</div>
    </details>
    <details><summary>Organizer worked example: ${s.organizer_reproduced} reproduced</summary>
      <table class="kv">${DATA.organizer_check.map(r => `<tr><td>${r.organizer_id}</td><td>${r.organizer_distance_mi} → ${r.our_distance_mi ?? "—"} mi</td></tr>`).join("")}</table>
      <div class="muted">Small differences on OVL_3/OVL_6: the organizer sheet gives McIntosh two different longitudes (−81.1751 and −81.1821); we use one.</div>
    </details>`;
}

function renderUnmapped() {
  const un = allProjects().filter(p => !p.geo);
  document.getElementById("unmapped").innerHTML = `<details><summary><b>${un.length} projects not mapped</b> (no endpoint could be located with confidence)</summary>
    <ul class="unmapped">${un.map(p => `<li>${tag(p.utility)} ${esc(p.title)}
      <div class="muted">${p.endpoints.map(e => `${esc(e.name)}: ${(e.notes || []).slice(-1).map(esc).join("")}`).join("<br/>")}</div></li>`).join("")}</ul></details>`;
}

fetch("data/sentinel_dataset.json").then(r => r.json()).then(data => {
  DATA = data;
  allProjects(data).forEach(p => BY_ID[p.project_id] = p);
  initMap();
  renderProjects();
  renderStats();
  renderFilters();
  renderList();
  renderMethod();
  renderUnmapped();
  const deep = DATA.overlaps.find(o => "#" + o.overlap_id === location.hash);
  if (deep) focusOverlap(deep);
  fetch("data/cost_impact_estimate.json").then(r => r.ok ? r.json() : null).then(renderCostImpact).catch(() => renderCostImpact(null));
});
</script>
</body>
</html>
